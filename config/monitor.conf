#!/usr/bin/env bash
# =============================================================================
# config/monitor.conf - Server Monitor configuration
#
# This file is SOURCED by monitor.sh, so it must be valid Bash: KEY="value".
# It may contain a webhook secret -> keep permissions at 600 (install.sh does
# this for you). monitor.sh refuses to run if the file is world-writable.
#
# ${BASE_DIR} is available here and points to the project directory.
# =============================================================================

# -----------------------------------------------------------------------------
# Thresholds (percent). WARN fires when value > *_WARN, CRITICAL when > *_CRIT.
# -----------------------------------------------------------------------------
CPU_WARN=80
CPU_CRIT=95
MEM_WARN=85
MEM_CRIT=95
DISK_WARN=85
DISK_CRIT=95

# Seconds between the two /proc/stat samples used to compute CPU usage.
CPU_SAMPLE_SECONDS=2

# -----------------------------------------------------------------------------
# Disk partitions
# -----------------------------------------------------------------------------
# Space-separated list of paths to check (e.g. "/ /var /home").
# Leave empty to auto-discover every mounted real filesystem.
# Note: a path that is not its own mount point (e.g. /var living on /) is
# reported under the filesystem that actually holds it.
DISK_MOUNTS=""

# Filesystem types ignored during auto-discovery.
DISK_EXCLUDE_FS="tmpfs devtmpfs squashfs overlay iso9660 efivarfs"

# Mount points matching this extended regex are ignored during auto-discovery.
DISK_EXCLUDE_MOUNT_REGEX='^/(snap|run|sys|proc|dev)(/|$)'

# -----------------------------------------------------------------------------
# Critical services (systemd unit names, without ".service")
# Common aliases are resolved automatically (sshd<->ssh, cron<->crond,
# apache2<->httpd, mysql<->mariadb). Hosts without systemd fall back to pgrep.
# -----------------------------------------------------------------------------
CRITICAL_SERVICES="sshd cron"
# Examples:
# CRITICAL_SERVICES="sshd cron nginx docker"
# CRITICAL_SERVICES="sshd crond httpd mariadb"

# -----------------------------------------------------------------------------
# Network / connectivity
# -----------------------------------------------------------------------------
# Space-separated targets. The keyword "gateway" resolves to the default route.
PING_TARGETS="gateway 1.1.1.1"
PING_COUNT=3          # ICMP echo requests per target
PING_TIMEOUT=3        # seconds to wait per reply
NET_LOSS_WARN=25      # packet loss % that raises WARN
NET_LOSS_CRIT=100     # packet loss % that raises CRITICAL (100 = unreachable)
NET_RTT_WARN_MS=250   # average round-trip (ms) that raises WARN

# -----------------------------------------------------------------------------
# Alerting
# -----------------------------------------------------------------------------
# Minutes to wait before repeating an identical alert (same key, same or lower
# severity). A WARN -> CRITICAL escalation is always sent immediately.
ALERT_COOLDOWN_MINUTES=15

# Number of processes listed in the "top consumers" snapshot attached to alerts.
TOP_N=5

# Webhook delivery (primary channel). Leave empty to disable.
#   Slack:   https://hooks.slack.com/services/T000/B000/XXXX
#   Discord: https://discord.com/api/webhooks/ID/TOKEN
WEBHOOK_URL=""
WEBHOOK_TYPE="slack"      # slack | discord | generic (plain JSON)
WEBHOOK_TIMEOUT=10        # seconds

# Local mail fallback: used when no webhook is configured or the webhook fails.
# Space-separated recipients. Requires a working `mail` command (mailutils/mailx).
MAIL_TO=""

# Also write every notification to syslog (facility daemon, tag server-monitor).
USE_SYSLOG="true"

# Name shown in alerts and logs. Empty = output of `hostname -f`.
HOSTNAME_LABEL=""

# -----------------------------------------------------------------------------
# Paths and retention
# -----------------------------------------------------------------------------
# For a system-wide install you may prefer:
#   LOG_FILE="/var/log/server_monitor.log"   (directory must be writable)
LOG_FILE="${BASE_DIR}/logs/monitor.log"
STATE_DIR="${BASE_DIR}/state"
LOG_RETENTION_DAYS=7
